# Render free web service using the same Docker image as local development.
# Deploys the committed read-only data/sat.duckdb; learner progress lives in
# browser localStorage, not the server disk.
services:
  - type: web
    name: wordcraft
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    healthCheckPath: /login
    envVars:
      - key: APP_PASSWORD
        sync: false            # set in Render dashboard, never in the repo
      - key: OPENROUTER_API_KEY
        sync: false            # set in Render dashboard, never in the repo
      - key: SESSION_SECRET
        generateValue: true      # Render generates and stores a strong secret
      - key: ALLOW_RW
        value: "0"             # read-only; AI examples cached in-memory + browser localStorage